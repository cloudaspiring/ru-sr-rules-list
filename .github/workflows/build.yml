name: Build Shadowrocket rules

on:
  schedule:
    - cron: "17 */6 * * *"   # каждые 6 часов, как и источник
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Convert
        run: |
          # Категории — по одной в строке, в кавычках. Порядок = порядок правил (REJECT первым).
          SPECS=(
            "my-direct=file:direct.txt"
            "my-proxy=file:proxy.txt"
            "ads=geosite:category-ads-all"
            "telegram=geosite:telegram+geoip:telegram"
            "youtube=geosite:youtube"
            "ru-blocked=geosite:ru-blocked"
            "ru-blocked-ip=geoip:ru-blocked"
          )

          SCRIPT=$(find . -name 'geodat2shadowrocket*.py' -not -path './.git/*' | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "::error::geodat2shadowrocket.py не найден в репозитории"; ls -laR; exit 1
          fi
          echo "Скрипт: $SCRIPT"

          BASE="https://raw.githubusercontent.com/${{ github.repository }}/rules"
          python3 "$SCRIPT" -o out --base-url "$BASE" --policy ads=REJECT --policy my-direct=DIRECT --final DIRECT "${SPECS[@]}"
          ls -la out

      - name: Publish to 'rules' branch
        run: |
          cd out
          git init -q -b rules
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "rules $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" rules
